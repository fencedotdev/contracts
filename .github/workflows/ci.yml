name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Phase 0 checklist 0.3.1-0.3.4: the four steps every one of the 10 repos runs,
# regardless of whether it's a deployable service, a library, or a Next.js app.
#
# NOT included here yet: Docker build/publish (0.3.5-0.3.7, deployable/library
# repos only) and the migration dry-run (0.3.8, identity-kyb only) — those need
# a real Dockerfile/schema to exist first and get added per-repo once that repo
# has application code, not at template-creation time.
#
# Runs on the self-hosted Hetzner runner pool (inherited from doc-e-sign, Appendix
# G) — confirm pool capacity/isolation (0.3.10/0.3.10a) before this generates real
# PR volume. `runs-on` below assumes that pool exists; swap to `ubuntu-latest` if
# it isn't provisioned yet for this org.
jobs:
  ci:
    runs-on: [self-hosted, fencedotdev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Step 1 (0.3.2): fail on any high/critical vulnerability, before any build step.
      - name: npm audit
        run: npm audit --audit-level=high

      # New, v1.7 (0.3.2a): Semgrep SAST — named in the stack (App. G) but previously
      # never actually wired into CI.
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      # Step 2 (0.3.3): fail on any type error.
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      # Step 3 (0.3.4): the placeholder test (0.2.3) must pass here.
      - name: Test
        run: npm test -- --coverage
