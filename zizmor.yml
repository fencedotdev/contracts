# Config for zizmor (GitHub Actions security static analysis), added
# 2026-08-12 after Aikido flagged unpinned actions and GitHub Actions
# script injection — both now fixed everywhere, and this tool exists so a
# regression of either (or anything else zizmor checks) fails CI
# immediately instead of waiting for the next external scan.
#
# Migrated 2026-08-21 from file:line suppressions here to inline
# `# zizmor: ignore[rule-id]` comments at each flagged line, while
# restructuring this repo into a monorepo (contracts -> packages) — the
# file:line approach had already drifted twice by the time this
# restructuring PR touched ci.yml (confirmed via a live `zizmor` run
# before fixing), for exactly the reason identity-kyb hit this five times
# over: any edit to a workflow file above a suppressed finding's line
# shifts it and re-triggers CI failure on an already-triaged issue.
# Inline comments travel with the line itself, so they can't drift out of
# sync the same way. This file is kept (rather than deleted) as the
# historical record of that decision — no active suppressions live here
# anymore.
#
# Inline comment syntax, confirmed empirically against zizmor v1.29.0 —
# the docs (docs.zizmor.sh/usage/#ignoring-findings) undersell this
# precisely: `# zizmor: ignore[rule-id]` must be the FIRST thing in its
# comment span, on the same line as the flagged key/step. A comment on
# the line(s) *preceding* the flagged node is NOT reliably recognized.
# Also doesn't work if any other text (e.g. an existing `# v1.2.3`
# version-pin comment) precedes `zizmor:` within the same comment — put
# the ignore token first and move any existing comment text after it
# instead, e.g. `# zizmor: ignore[artipacked] low exposure (v7.0.1)`.
rules: {}
